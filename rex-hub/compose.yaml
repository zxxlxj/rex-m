services:
  rex-hub:
    build: .
    image: rex-hub:0.0.7
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${REX_BIND:-127.0.0.1}:${REX_PORT:-8080}:8080"
    environment:
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      ALLOW_INSECURE_HTTP: "${ALLOW_INSECURE_HTTP:-0}"
      SETUP_TOKEN: "${SETUP_TOKEN:-}"
      TZ: Asia/Shanghai
    volumes:
      - rex-data:/data
volumes:
  rex-data:
