name = "rex-hub"
main = "src/index.mjs"
compatibility_date = "2026-11-19"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "rex-hub"
# Cloudflare's deploy button replaces template IDs with new resources.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "FILE_KV"
id = "00000000000000000000000000000000"
