[package]
name = "rex-hub"
version = "0.0.7"
edition = "2021"
rust-version = "1.93"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "sync", "time", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
url = "2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
pbkdf2 = "0.12"
rand = "0.8"
subtle = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
