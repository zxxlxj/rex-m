name: Rex Hub Docker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rex-hub/docker/**'
      - 'rex-hub/Dockerfile'
      - 'rex-hub/.dockerignore'
      - 'rex-hub/migrations/**'
      - 'rex-hub/public/**'
      - '.github/workflows/rex-hub-docker.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: rex-hub-docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: rex-hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rex-hub:latest
            ghcr.io/${{ github.repository_owner }}/rex-hub:sha-${{ github.sha }}
